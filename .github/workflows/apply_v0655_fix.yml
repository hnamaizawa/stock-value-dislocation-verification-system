name: Apply v0.6.55 dashboard timedelta fix

on:
  push:
    branches:
      - fix/v0.6.55-dashboard-timedelta-warning

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.6.55-dashboard-timedelta-warning
      - name: Apply source fix and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dashboard = Path("dashboard.py")
          text = dashboard.read_text(encoding="utf-8")
          old_expr = "pd.Timedelta(days=30).to_pytimedelta()"
          assert text.count(old_expr) == 1, f"expected one deprecated expression, found {text.count(old_expr)}"
          if "from datetime import timedelta\n" not in text:
              text = text.replace("from pathlib import Path\n", "from datetime import timedelta\nfrom pathlib import Path\n", 1)
          text = text.replace(old_expr, "timedelta(days=30)", 1)
          dashboard.write_text(text, encoding="utf-8")

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          assert 'version = "0.6.54"' in text
          pyproject.write_text(text.replace('version = "0.6.54"', 'version = "0.6.55"', 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          current = changelog.read_text(encoding="utf-8")
          entry = '''## v0.6.55\n- 「履歴・実績検証」の期間初期値で残っていた `pd.Timedelta(days=30).to_pytimedelta()` を Python 標準の `datetime.timedelta(days=30)` へ変更。\n- NumPy の generic timedelta DeprecationWarning が Streamlit 再実行時に大量出力される問題を解消。\n- 警告の抑制ではなく原因式を除去し、同じ非推奨表現が dashboard.py に再導入されない回帰テストを追加。\n- 抽出条件、履歴データ、J-Quants / Yahoo データ取得、安全境界は変更なし。\n\n'''
          if not current.startswith("## v0.6.55"):
              changelog.write_text(entry + current, encoding="utf-8")

          test = Path("tests/test_dashboard_timedelta_compat.py")
          test.write_text('''from pathlib import Path\n\n\ndef test_dashboard_history_period_uses_python_timedelta():\n    text = Path("dashboard.py").read_text(encoding="utf-8")\n    assert "from datetime import timedelta" in text\n    assert "pd.Timedelta(days=30).to_pytimedelta()" not in text\n    assert "last_day - timedelta(days=30)" in text\n''', encoding="utf-8")

          workflow = Path(".github/workflows/apply_v0655_fix.yml")
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Verify patch shape
        run: |
          git diff --check
          grep -q 'from datetime import timedelta' dashboard.py
          ! grep -q 'pd.Timedelta(days=30).to_pytimedelta()' dashboard.py
          grep -q 'version = "0.6.55"' pyproject.toml
      - name: Commit fix to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix dashboard generic timedelta warning"
          git push origin HEAD:fix/v0.6.55-dashboard-timedelta-warning
