name: Apply v0.6.60 history analysis summaries

on:
  push:
    branches:
      - fix/v0.6.60-legacy-horizon-columns

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.6.60-legacy-horizon-columns
      - name: Apply history summary patch
        run: python scripts/apply_history_summary_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py src/value_dislocation/history.py tests/test_history_text_summary.py README.md CHANGELOG.md tasks/CURRENT.md
          if ! git diff --cached --quiet; then
            git commit -m "Add history analysis result summaries"
            git push origin HEAD:fix/v0.6.60-legacy-horizon-columns
          fi
