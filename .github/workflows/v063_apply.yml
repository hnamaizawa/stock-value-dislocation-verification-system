name: v063 guarded patch

on:
  push:
    branches:
      - feature/v0.6.63-strategy-validation
    paths:
      - scripts/v063_apply_patch.py
      - .github/workflows/v063_apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6.63-strategy-validation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply v0.6.63 patch
        run: python scripts/v063_apply_patch.py
      - name: Remove temporary patch infrastructure before validation
        run: rm -f scripts/v063_apply_patch.py .github/workflows/v063_apply.yml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dashboard,dev]"
      - name: Run pytest
        run: python -m pytest tests/
      - name: Run harness
        run: python scripts/harness_check.py
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement v0.6.63 strategy validation" || exit 0
          git push origin HEAD:feature/v0.6.63-strategy-validation
