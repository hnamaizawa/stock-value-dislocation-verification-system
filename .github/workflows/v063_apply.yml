name: v063 guarded implementation

on:
  push:
    branches:
      - feature/v0.6.63-walkforward-controls-attribution

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6.63-walkforward-controls-attribution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Fix version-test patch helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/apply_v063_patch.py")
          text = p.read_text(encoding="utf-8")
          old = '''for path in ["tests/test_package_init.py", "tests/test_sort_performance_and_readme_structure.py"]:
    p = Path(path)
    p.write_text(p.read_text(encoding="utf-8").replace("0.6.62", "0.6.63"), encoding="utf-8")
'''
          new = '''p = Path("tests/test_package_init.py")
t = p.read_text(encoding="utf-8")
t = t.replace('assert value_dislocation.__version__ == "0.6.62"', 'assert value_dislocation.__version__ == "0.6.63"', 1)
p.write_text(t, encoding="utf-8")

p = Path("tests/test_sort_performance_and_readme_structure.py")
t = p.read_text(encoding="utf-8")
t = t.replace('assert lines[2] == "Version: **0.6.62**"', 'assert lines[2] == "Version: **0.6.63**"', 1)
t = t.replace(
    '        "### v0.6.62 構造悪化ガードでバリュートラップを識別",\\n',
    '        "### v0.6.63 Walk-Forward・類似非選択比較・外因説明率",\\n        "### v0.6.62 構造悪化ガードでバリュートラップを識別",\\n',
    1,
)
p.write_text(t, encoding="utf-8")
'''
          if old not in text:
              raise SystemExit("version-test patch block not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply v0.6.63 integration patch
        run: python scripts/apply_v063_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dashboard,dev]"
      - name: Run pytest
        run: python -m pytest tests/
      - name: Run harness
        run: python scripts/harness_check.py
      - name: Commit validated implementation and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/v063_apply.yml scripts/apply_v063_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement v0.6.63 walk-forward controls and attribution [v063-applied]"
          git push origin HEAD:feature/v0.6.63-walkforward-controls-attribution
