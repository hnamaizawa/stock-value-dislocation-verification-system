name: Align v0.6.55 version metadata

on:
  push:
    branches:
      - fix/v0.6.55-dashboard-timedelta-warning

permissions:
  contents: write

jobs:
  align-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.6.55-dashboard-timedelta-warning
      - name: Align version metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("Version: **0.6.53**", "Version: **0.6.55**", 1)
          marker = "### v0.6.53 ソート高速化・README再構成"
          insert = '''### v0.6.55 履歴画面の generic timedelta 警告修正\n\n- 「履歴・実績検証」の直近30日初期値を Python 標準の `datetime.timedelta` で計算し、NumPy の generic timedelta DeprecationWarning を解消しました。\n- 警告を隠すのではなく原因式を除去し、再発防止テストを追加しました。\n\n### v0.6.54 履歴実績から定量抽出ルールを安全に自動改善\n\n- point-in-time の分析履歴と取得済み株価を使い、定量抽出条件を時系列の学習期間／検証期間で安全に自動校正する仕組みを追加しました。\n- 外的要因レビューや人の承認、安全境界は自動変更の対象外です。\n\n'''
          if "### v0.6.55 履歴画面の generic timedelta 警告修正" not in text:
              assert marker in text
              text = text.replace(marker, insert + marker, 1)
          readme.write_text(text, encoding="utf-8")

          blueprint = Path("harness/app_blueprint.yaml")
          text = blueprint.read_text(encoding="utf-8")
          assert "blueprint_version: 0.6.54" in text
          blueprint.write_text(text.replace("blueprint_version: 0.6.54", "blueprint_version: 0.6.55", 1), encoding="utf-8")

          init = Path("src/value_dislocation/__init__.py")
          init.write_text('__version__ = "0.6.55"\n', encoding="utf-8")

          workflow = Path(".github/workflows/align_v0655_metadata.yml")
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Verify metadata
        run: |
          git diff --check
          grep -q 'Version: \*\*0.6.55\*\*' README.md
          grep -q 'blueprint_version: 0.6.55' harness/app_blueprint.yaml
          grep -q '__version__ = "0.6.55"' src/value_dislocation/__init__.py
      - name: Commit metadata alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align v0.6.55 version metadata"
          git push origin HEAD:fix/v0.6.55-dashboard-timedelta-warning
