name: Apply v0.6.53 sort performance and README restructure

on:
  push:
    branches:
      - feature/v0.6.53-sort-performance-readme
    paths:
      - .github/workflows/apply-v0653.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6.53-sort-performance-readme
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply v0.6.53 changes
        run: |
          python scripts/_apply_v0653.py
          python scripts/_fix_v0653_test.py

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dashboard,dev]"

      - name: Run pytest
        run: python -m pytest tests/

      - name: Run harness checks
        run: python scripts/harness_check.py

      - name: Commit v0.6.53 changes and remove temporary files
        run: |
          rm -rf src/*.egg-info
          rm scripts/_apply_v0653.py
          rm scripts/_fix_v0653_test.py
          rm .github/workflows/apply-v0653.yml
          git config user.name "hnamaizawa"
          git config user.email "hnamaizawa@gmail.com"
          git add dashboard.py pyproject.toml README.md CHANGELOG.md tests/test_sort_performance_and_readme_structure.py
          git add -u scripts/_apply_v0653.py scripts/_fix_v0653_test.py .github/workflows/apply-v0653.yml
          git commit -m "v0.6.53 improve sort responsiveness and README structure"
          git push origin feature/v0.6.53-sort-performance-readme
