name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out feature branch for bootstrap
        uses: actions/checkout@v4
        with:
          ref: feature/v0.6.57-candidate-stock-new-tab
          fetch-depth: 0

      - name: Apply v0.6.57 implementation and restore normal CI
        run: |
          python scripts/_apply_v0_6_57.py
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm scripts/_apply_v0_6_57.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement v0.6.57 candidate stock new-tab navigation"
          git push origin HEAD:feature/v0.6.57-candidate-stock-new-tab

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dashboard,dev]"

      - name: Run pytest
        run: python -m pytest tests/

      - name: Run harness checks
        run: python scripts/harness_check.py
