name: Apply v0.6.59 horizons patch

on:
  push:
    branches:
      - feature/v0.6.59-extended-validation-horizons

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6.59-extended-validation-horizons
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'pattern not unique in {path}: count={text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # history.py: one shared ordered horizon definition and all calculations/views use it.
          replace_once('src/value_dislocation/history.py',
              ']\n\n\ndef history_root(project_root: Path) -> Path:',
              ']\n\nSTAR_OUTCOME_HORIZONS = (10, 20, 30, 60, 90, 180)\n\n\ndef history_root(project_root: Path) -> Path:')
          replace_once('src/value_dislocation/history.py',
              'def build_star_events(evaluations: pd.DataFrame, horizons: Iterable[int] = (30, 90, 180)) -> pd.DataFrame:',
              'def build_star_events(evaluations: pd.DataFrame, horizons: Iterable[int] = STAR_OUTCOME_HORIZONS) -> pd.DataFrame:')
          replace_once('src/value_dislocation/history.py',
              '    30/90/180-day returns are carried forward by (code, star_date), so adding an\n',
              '    10/20/30/60/90/180-day returns are carried forward by (code, star_date), so adding an\n')
          replace_once('src/value_dislocation/history.py',
              '    preserve = [\n        "entry_price",\n        "return_30d", "return_90d", "return_180d",\n        "actual_days_30d", "actual_days_90d", "actual_days_180d",\n    ]',
              '    preserve = ["entry_price"]\n    for horizon in STAR_OUTCOME_HORIZONS:\n        preserve.extend([f"return_{horizon}d", f"actual_days_{horizon}d"])')
          replace_once('src/value_dislocation/history.py',
              'def enrich_star_events_with_market_histories(star_events: pd.DataFrame, histories: dict[str, pd.DataFrame], horizons: Iterable[int] = (30, 90, 180)) -> pd.DataFrame:',
              'def enrich_star_events_with_market_histories(star_events: pd.DataFrame, histories: dict[str, pd.DataFrame], horizons: Iterable[int] = STAR_OUTCOME_HORIZONS) -> pd.DataFrame:')
          replace_once('src/value_dislocation/history.py',
              '    30/90/180-day returns.\n',
              '    10/20/30/60/90/180-day returns.\n')
          replace_once('src/value_dislocation/history.py',
              '    for horizon in (30, 90, 180):\n        frame[f"_return_{horizon}d"]',
              '    for horizon in STAR_OUTCOME_HORIZONS:\n        frame[f"_return_{horizon}d"]')
          replace_once('src/value_dislocation/history.py',
              '        for horizon in (30, 90, 180):\n            values = g[f"_return_{horizon}d"]',
              '        for horizon in STAR_OUTCOME_HORIZONS:\n            values = g[f"_return_{horizon}d"]')
          replace_once('src/value_dislocation/history.py',
              '    """Summarize matured ◎☆ forward returns by 30/90/180-day horizon for charts."""\n',
              '    """Summarize matured ◎☆ forward returns by configured short/medium horizons for charts."""\n')
          replace_once('src/value_dislocation/history.py',
              '    for horizon in (30, 90, 180):\n        values = pd.to_numeric(frame.get(f"return_{horizon}d", pd.Series(dtype=float)), errors="coerce").dropna()',
              '    for horizon in STAR_OUTCOME_HORIZONS:\n        values = pd.to_numeric(frame.get(f"return_{horizon}d", pd.Series(dtype=float)), errors="coerce").dropna()')
          replace_once('src/value_dislocation/history.py',
              '        for h in (30,90,180):\n            r=pd.to_numeric(subset.get(f"return_{h}d"), errors="coerce").dropna()',
              '        for h in STAR_OUTCOME_HORIZONS:\n            r=pd.to_numeric(subset.get(f"return_{h}d"), errors="coerce").dropna()')

          # dashboard.py: show and refresh all six horizons in chronological order.
          replace_once('dashboard.py',
              'from value_dislocation.history import (\n    attach_daily_final_evaluations,',
              'from value_dislocation.history import (\n    STAR_OUTCOME_HORIZONS,\n    attach_daily_final_evaluations,')
          replace_once('dashboard.py',
              '        "star_summary": ["first_star_date", "latest_star_date", "star_count", "latest_entry_price", "return_30d_avg"],\n        "star_events_detail": ["star_date", "entry_price", "return_30d", "return_90d", "return_180d"],',
              '        "star_summary": ["first_star_date", "latest_star_date", "star_count", "latest_entry_price", "return_10d_avg"],\n        "star_events_detail": ["star_date", "entry_price", "return_10d", "return_20d", "return_30d"],')
          replace_once('dashboard.py',
              '    refresh_clicked = refresh_col.button("Yahooで30/90/180日実績を更新", key="history_refresh_star_outcomes", type="primary")',
              '    refresh_clicked = refresh_col.button("Yahooで10/20/30/60/90/180日実績を更新", key="history_refresh_star_outcomes", type="primary")')
          replace_once('dashboard.py',
              '            with st.spinner(f"◎☆実績の30/90/180日リターンを最新Yahoo日足で更新しています（{len(star_codes)}銘柄）…"):',
              '            with st.spinner(f"◎☆実績の10/20/30/60/90/180日リターンを最新Yahoo日足で更新しています（{len(star_codes)}銘柄）…"):')
          replace_once('dashboard.py',
              '    completed30 = pd.to_numeric(star_events.get("return_30d"), errors="coerce").dropna()\n    completed90 = pd.to_numeric(star_events.get("return_90d"), errors="coerce").dropna()\n    completed180 = pd.to_numeric(star_events.get("return_180d"), errors="coerce").dropna()\n    unique_star_codes = star_events.get("code", pd.Series(dtype=str)).dropna().astype(str).nunique()\n    m = st.columns(4)\n    m[0].metric("◎☆開始イベント", f"{len(star_events):,}", f"ユニーク {unique_star_codes:,} 銘柄")\n    m[1].metric("30日確定", f"{len(completed30):,}", f"平均 {completed30.mean()*100:.1f}%" if len(completed30) else "未確定")\n    m[2].metric("90日確定", f"{len(completed90):,}", f"平均 {completed90.mean()*100:.1f}%" if len(completed90) else "未確定")\n    m[3].metric("180日確定", f"{len(completed180):,}", f"平均 {completed180.mean()*100:.1f}%" if len(completed180) else "未確定")',
              '    completed_by_horizon = {\n        horizon: pd.to_numeric(star_events.get(f"return_{horizon}d"), errors="coerce").dropna()\n        for horizon in STAR_OUTCOME_HORIZONS\n    }\n    unique_star_codes = star_events.get("code", pd.Series(dtype=str)).dropna().astype(str).nunique()\n    first_metrics = st.columns(4)\n    first_metrics[0].metric("◎☆開始イベント", f"{len(star_events):,}", f"ユニーク {unique_star_codes:,} 銘柄")\n    for idx, horizon in enumerate((10, 20, 30), start=1):\n        completed = completed_by_horizon[horizon]\n        first_metrics[idx].metric(f"{horizon}日確定", f"{len(completed):,}", f"平均 {completed.mean()*100:.1f}%" if len(completed) else "未確定")\n    second_metrics = st.columns(3)\n    for idx, horizon in enumerate((60, 90, 180)):\n        completed = completed_by_horizon[horizon]\n        second_metrics[idx].metric(f"{horizon}日確定", f"{len(completed):,}", f"平均 {completed.mean()*100:.1f}%" if len(completed) else "未確定")')
          replace_once('dashboard.py',
              '        st.caption("実績が確定した◎☆開始イベントだけを使った30/90/180日後の平均リターンです。未確定イベントは含みません。")',
              '        st.caption("実績が確定した◎☆開始イベントだけを使った10/20/30/60/90/180日後の平均リターンです。未確定イベントは含みません。")')
          replace_once('dashboard.py',
              '    st.caption("同じ銘柄が複数回◎☆になっても銘柄コード単位で1行にまとめます。初回/最新の◎☆日、◎☆回数、最新entry_price、確定済みイベントの平均30/90/180日リターンを表示します。")',
              '    st.caption("同じ銘柄が複数回◎☆になっても銘柄コード単位で1行にまとめます。初回/最新の◎☆日、◎☆回数、最新entry_price、確定済みイベントの平均10/20/30/60/90/180日リターンを表示します。")')
          replace_once('dashboard.py',
              '    for h in (30, 90, 180):\n        col = f"return_{h}d_avg"',
              '    for h in STAR_OUTCOME_HORIZONS:\n        col = f"return_{h}d_avg"')
          replace_once('dashboard.py',
              '    summary_cols = [\n        "code", "name", "first_star_date", "latest_star_date", "star_count", "latest_entry_price",\n        "return_30d_avg", "completed_30d", "return_90d_avg", "completed_90d", "return_180d_avg", "completed_180d",\n    ]',
              '    summary_cols = ["code", "name", "first_star_date", "latest_star_date", "star_count", "latest_entry_price"]\n    for h in STAR_OUTCOME_HORIZONS:\n        summary_cols.extend([f"return_{h}d_avg", f"completed_{h}d"])')
          replace_once('dashboard.py',
              '        for h in (30, 90, 180):\n            if f"return_{h}d" in event_show.columns:',
              '        for h in STAR_OUTCOME_HORIZONS:\n            if f"return_{h}d" in event_show.columns:')
          replace_once('dashboard.py',
              '        event_cols = ["star_date", "code", "name", "entry_price", "return_30d", "return_90d", "return_180d", "actual_days_30d", "actual_days_90d", "actual_days_180d"]',
              '        event_cols = ["star_date", "code", "name", "entry_price"]\n        for h in STAR_OUTCOME_HORIZONS:\n            event_cols.extend([f"return_{h}d", f"actual_days_{h}d"])')
          replace_once('dashboard.py',
              '            ["30日", "90日", "180日"],\n            default="90日",',
              '            [f"{h}日" for h in STAR_OUTCOME_HORIZONS],\n            default="90日",')

          # Version/docs.
          replace_once('pyproject.toml', 'version = "0.6.58"', 'version = "0.6.59"')
          replace_once('src/value_dislocation/__init__.py', '__version__ = "0.6.58"', '__version__ = "0.6.59"')
          replace_once('harness/app_blueprint.yaml', 'blueprint_version: 0.6.58', 'blueprint_version: 0.6.59')
          replace_once('README.md', 'Version: **0.6.58**', 'Version: **0.6.59**')
          replace_once('README.md',
              '### v0.6.58 大規模データ更新・画面遷移の高速化\n',
              '### v0.6.59 実績検証の短中期評価期間を拡張\n\n- ◎☆実績検証の評価期間を 10日・20日・30日・60日・90日・180日に拡張しました。\n- Yahoo実績更新、平均リターン、確定件数、銘柄別サマリ、イベント詳細、条件別実績グラフを同じ期間セットで統一しました。\n- 既存の30/90/180日履歴は維持し、新しい10/20/60日は保存済みYahoo日足または次回の明示更新で補完できます。\n\n### v0.6.58 大規模データ更新・画面遷移の高速化\n')
          replace_once('CHANGELOG.md',
              '## v0.6.58\n',
              '## v0.6.59\n- 「履歴・実績検証 > ◎☆実績検証」の評価期間に10日・20日・60日を追加し、10/20/30/60/90/180日の順で表示。\n- Yahoo日足による実績更新、銘柄別平均、イベント詳細、条件別実績集計を同一の共通期間定義へ統一。\n- 既存30/90/180日データとの後方互換を維持し、新期間は再評価・Yahoo実績更新で段階的に補完。\n\n## v0.6.58\n')
          replace_once('tasks/CURRENT.md',
              '## v0.6.58 large-data performance optimization\n',
              '## v0.6.59 extended validation horizons\n\n- [x] ◎☆実績検証に10日・20日・60日を追加する。\n- [x] 10/20/30/60/90/180日の順序を画面・集計・Yahoo更新で統一する。\n- [x] 既存30/90/180日の保存結果を保持する。\n- [x] 回帰テストを追加する。\n\n## v0.6.58 large-data performance optimization\n')

          # Existing tests with explicit version/button contracts.
          replace_once('tests/test_package_init.py', 'assert value_dislocation.__version__ == "0.6.58"', 'assert value_dislocation.__version__ == "0.6.59"')
          replace_once('tests/test_history_dashboard.py',
              'assert \'button("Yahooで30/90/180日実績を更新"\' in text',
              'assert \'button("Yahooで10/20/30/60/90/180日実績を更新"\' in text')
          replace_once('tests/test_sort_performance_and_readme_structure.py', 'assert lines[2] == "Version: **0.6.58**"', 'assert lines[2] == "Version: **0.6.59**"')
          replace_once('tests/test_sort_performance_and_readme_structure.py',
              '    versions = [\n        "### v0.6.58 大規模データ更新・画面遷移の高速化",',
              '    versions = [\n        "### v0.6.59 実績検証の短中期評価期間を拡張",\n        "### v0.6.58 大規模データ更新・画面遷移の高速化",')

          # New regression coverage.
          Path('tests/test_extended_validation_horizons.py').write_text('''from datetime import timedelta\n\nimport pandas as pd\n\nfrom value_dislocation.history import (\n    STAR_OUTCOME_HORIZONS,\n    build_star_events,\n    star_forward_return_summary,\n    summarize_star_outcomes_by_code,\n)\n\n\ndef test_star_outcome_horizons_include_requested_short_and_mid_terms_in_order():\n    assert STAR_OUTCOME_HORIZONS == (10, 20, 30, 60, 90, 180)\n\n\ndef test_build_star_events_computes_all_extended_horizons():\n    start = pd.Timestamp("2026-01-01")\n    closes = {0: 100.0, 10: 101.0, 20: 102.0, 30: 103.0, 60: 106.0, 90: 109.0, 180: 118.0}\n    rows = []\n    for days, close in closes.items():\n        rows.append({\n            "evaluation_date": (start + timedelta(days=days)).date().isoformat(),\n            "latest_market_date": (start + timedelta(days=days)).date().isoformat(),\n            "code": "72030",\n            "name": "テスト",\n            "intuitive_symbol": "◎☆" if days == 0 else "○",\n            "latest_price": close,\n            "latest_trend": "上昇",\n        })\n    events = build_star_events(pd.DataFrame(rows))\n    assert len(events) == 1\n    event = events.iloc[0]\n    for horizon in STAR_OUTCOME_HORIZONS:\n        assert round(float(event[f"return_{horizon}d"]), 6) == round(closes[horizon] / 100.0 - 1.0, 6)\n        assert int(event[f"actual_days_{horizon}d"]) == horizon\n\n\ndef test_forward_summary_and_code_summary_expose_all_horizons():\n    row = {"code": "72030", "name": "テスト", "star_date": "2026-01-01", "entry_price": 100.0}\n    for horizon in STAR_OUTCOME_HORIZONS:\n        row[f"return_{horizon}d"] = horizon / 1000.0\n    events = pd.DataFrame([row])\n    forward = star_forward_return_summary(events)\n    assert list(forward.index) == [f"{h}日" for h in STAR_OUTCOME_HORIZONS]\n    summary = summarize_star_outcomes_by_code(events)\n    for horizon in STAR_OUTCOME_HORIZONS:\n        assert f"return_{horizon}d_avg" in summary.columns\n        assert f"completed_{horizon}d" in summary.columns\n        assert int(summary.iloc[0][f"completed_{horizon}d"]) == 1\n\n\ndef test_dashboard_uses_extended_horizons_for_history_validation():\n    text = open("dashboard.py", encoding="utf-8").read()\n    assert "Yahooで10/20/30/60/90/180日実績を更新" in text\n    assert "for h in STAR_OUTCOME_HORIZONS" in text\n    assert '[f"{h}日" for h in STAR_OUTCOME_HORIZONS]' in text\n    assert 'for idx, horizon in enumerate((10, 20, 30), start=1)' in text\n    assert 'for idx, horizon in enumerate((60, 90, 180))' in text\n''', encoding='utf-8')

          # Remove this one-shot workflow from the resulting branch.
          Path('.github/workflows/apply-v0659-horizons.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement v0.6.59 extended validation horizons"
          git push origin HEAD:feature/v0.6.59-extended-validation-horizons
