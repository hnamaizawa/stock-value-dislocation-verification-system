name: v063 validation runner

on:
  push:
    branches:
      - feature/v0.6.63-walkforward-controls-attribution

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6.63-walkforward-controls-attribution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Correct temporary patch helper
        run: python scripts/fix_v063_helper.py
      - name: Apply implementation patch
        run: python scripts/apply_v063_patch.py
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dashboard,dev]"
      - name: Run pytest
        run: python -m pytest tests/
      - name: Run harness
        run: python scripts/harness_check.py
      - name: Commit validated implementation
        shell: bash
        run: |
          rm -f .github/workflows/v063_apply.yml .github/workflows/v063_runner.yml
          rm -f scripts/apply_v063_patch.py scripts/fix_v063_helper.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement v0.6.63 walk-forward controls and attribution [v063-applied]"
          git push origin HEAD:feature/v0.6.63-walkforward-controls-attribution
