name: v062 guarded patch

on:
  push:
    branches:
      - feature/v0.6.62-recovery-quality

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[v062-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6.62-recovery-quality
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply v0.6.62 patch
        run: python scripts/run_v062_patch.py
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dashboard,dev]"
      - name: Run pytest
        run: python -m pytest tests/
      - name: Run harness checks
        run: python scripts/harness_check.py
      - name: Commit validated changes
        run: |
          rm -f scripts/apply_v062_patch.py scripts/run_v062_patch.py .github/workflows/v062_apply.yml
          rm -rf src/stock_value_dislocation_verification_system.egg-info
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.6.62 recovery quality guard [v062-applied]"
          git push origin HEAD:feature/v0.6.62-recovery-quality
