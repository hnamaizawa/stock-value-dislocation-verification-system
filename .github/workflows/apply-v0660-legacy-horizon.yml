name: Apply v0.6.60 legacy horizon compatibility fix

on:
  push:
    branches:
      - fix/v0.6.60-legacy-horizon-columns

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.6.60-legacy-horizon-columns
      - name: Apply compatibility patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          history = Path("src/value_dislocation/history.py")
          text = history.read_text(encoding="utf-8")
          anchor = '''def _safe_code_series(frame: pd.DataFrame) -> pd.Series:\n    return frame.get("code", pd.Series(index=frame.index, dtype=str)).astype(str)\n'''
          helper = anchor + '''\n\ndef _numeric_column(frame: pd.DataFrame, column: str) -> pd.Series:\n    """Return one numeric Series even when an older persisted frame lacks the column."""\n    if column not in frame.columns:\n        return pd.Series(index=frame.index, dtype=float)\n    values = frame[column]\n    if isinstance(values, pd.DataFrame):\n        # Defensive compatibility for accidentally duplicated persisted columns.\n        values = values.iloc[:, -1] if values.shape[1] else pd.Series(index=frame.index, dtype=float)\n    return pd.to_numeric(values, errors="coerce")\n'''
          if "def _numeric_column(" not in text:
              if anchor not in text:
                  raise SystemExit("history helper anchor not found")
              text = text.replace(anchor, helper, 1)
          text = text.replace('frame[f"_return_{horizon}d"] = pd.to_numeric(frame.get(f"return_{horizon}d"), errors="coerce")', 'frame[f"_return_{horizon}d"] = _numeric_column(frame, f"return_{horizon}d")')
          text = text.replace('values = pd.to_numeric(frame.get(f"return_{horizon}d", pd.Series(dtype=float)), errors="coerce").dropna()', 'values = _numeric_column(frame, f"return_{horizon}d").dropna()')
          text = text.replace('r=pd.to_numeric(subset.get(f"return_{h}d"), errors="coerce").dropna()', 'r = _numeric_column(subset, f"return_{h}d").dropna()')
          history.write_text(text, encoding="utf-8")

          dashboard = Path("dashboard.py")
          text = dashboard.read_text(encoding="utf-8")
          text = text.replace(
              'horizon: pd.to_numeric(star_events.get(f"return_{horizon}d"), errors="coerce").dropna()',
              'horizon: pd.to_numeric(star_events.get(f"return_{horizon}d", pd.Series(index=star_events.index, dtype=float)), errors="coerce").dropna()',
          )
          dashboard.write_text(text, encoding="utf-8")

          learner = Path("src/value_dislocation/strategy/rule_learning.py")
          text = learner.read_text(encoding="utf-8")
          text = text.replace(
              'values = pd.to_numeric(frame.get(f"return_{horizon}d"), errors="coerce").dropna()',
              'values = pd.to_numeric(frame.get(f"return_{horizon}d", pd.Series(index=frame.index, dtype=float)), errors="coerce").dropna()',
          )
          text = text.replace(
              'eligible = eligible.loc[pd.to_numeric(eligible.get(f"return_{primary}d"), errors="coerce").notna()].copy()',
              'eligible = eligible.loc[pd.to_numeric(eligible.get(f"return_{primary}d", pd.Series(index=eligible.index, dtype=float)), errors="coerce").notna()].copy()',
          )
          learner.write_text(text, encoding="utf-8")

          tests = Path("tests/test_extended_validation_horizons.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace('    build_star_events,\n', '    build_star_events,\n    condition_performance,\n', 1)
          text += '''\n\ndef test_legacy_star_outcomes_without_new_horizon_columns_are_treated_as_unmatured(tmp_path):\n    analysis_dir = tmp_path / "data" / "history" / "analysis"\n    analysis_dir.mkdir(parents=True)\n    pd.DataFrame([{\n        "analysis_date": "2026-01-01",\n        "code": "72030",\n        "sales_cagr_3y": 0.05,\n        "operating_margin": 0.12,\n        "equity_ratio": 0.50,\n        "drawdown_52w": -0.25,\n        "relative_return_6m": -0.12,\n        "forecast_op_growth": 0.10,\n        "forecast_dividend_yield": 0.04,\n        "volatility_60d": 0.40,\n        "average_intraday_range_20d": 0.03,\n    }]).to_csv(analysis_dir / "2026-01-01.csv.gz", index=False, compression="gzip")\n\n    legacy_events = pd.DataFrame([{\n        "code": "72030",\n        "name": "テスト",\n        "star_date": "2026-01-01",\n        "entry_price": 100.0,\n        "return_30d": 0.03,\n        "return_90d": 0.09,\n        "return_180d": 0.18,\n    }])\n    perf = condition_performance(tmp_path, legacy_events)\n    assert not perf.empty\n    for horizon in (10, 20, 60):\n        assert f"{horizon}日確定件数" in perf.columns\n        assert (perf[f"{horizon}日確定件数"] == 0).all()\n'''
          tests.write_text(text, encoding="utf-8")

          replace_once("pyproject.toml", 'version = "0.6.59"', 'version = "0.6.60"')
          replace_once("src/value_dislocation/__init__.py", '__version__ = "0.6.59"', '__version__ = "0.6.60"')
          replace_once("harness/app_blueprint.yaml", 'blueprint_version: 0.6.59', 'blueprint_version: 0.6.60')
          replace_once("tests/test_package_init.py", 'assert value_dislocation.__version__ == "0.6.59"', 'assert value_dislocation.__version__ == "0.6.60"')

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace('Version: **0.6.59**', 'Version: **0.6.60**', 1)
          marker = '### v0.6.59 実績検証の短中期評価期間を拡張\n'
          section = '''### v0.6.60 旧実績データの期間列後方互換修正\n\n- v0.6.59以前に保存した `star_outcomes.csv(.gz)` に10日・20日・60日列が無くても、未確定データとして安全に扱うよう修正しました。\n- 条件別実績集計・確定件数表示・自動ルール学習で、欠損列を数値Seriesへ正規化して `numpy.float64` に対する `.dropna()` エラーを防止しました。\n- 既存の30日・90日・180日実績は保持し、10日・20日・60日はYahoo実績更新等で段階的に補完できます。\n\n'''
          if section not in text:
              text = text.replace(marker, section + marker, 1)
          readme.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = '''## v0.6.60\n- 旧 `star_outcomes.csv(.gz)` に新設の10/20/60日列が無い場合、空の数値Seriesとして扱う後方互換処理を追加。\n- `condition_performance()` の `numpy.float64` に対する `.dropna()` AttributeErrorを修正。\n- ◎☆確定件数表示とルール学習側にも同じ欠損列ガードを追加し、旧履歴を削除・再作成せず利用可能にした。\n\n'''
          if not text.startswith("## v0.6.60"):
              text = entry + text
          changelog.write_text(text, encoding="utf-8")

          current = Path("tasks/CURRENT.md")
          text = current.read_text(encoding="utf-8")
          entry = '''## v0.6.60 legacy outcome compatibility\n\n- [x] 旧star_outcomesに10/20/60日列が無くても条件別実績集計を失敗させない。\n- [x] 欠損期間列は未確定（0件）として扱い、既存30/90/180日データを保持する。\n- [x] 画面の確定件数とルール学習にも欠損列ガードを追加する。\n- [x] 実データ再作成を要求せず、回帰テストで後方互換を固定する。\n\n'''
          if not text.startswith("## v0.6.60"):
              text = entry + text
          current.write_text(text, encoding="utf-8")

          perf_test = Path("tests/test_sort_performance_and_readme_structure.py")
          text = perf_test.read_text(encoding="utf-8")
          text = text.replace('assert lines[2] == "Version: **0.6.59**"', 'assert lines[2] == "Version: **0.6.60**"')
          marker = '        "### v0.6.59 実績検証の短中期評価期間を拡張",\n'
          if '"### v0.6.60 旧実績データの期間列後方互換修正"' not in text:
              text = text.replace(marker, '        "### v0.6.60 旧実績データの期間列後方互換修正",\n' + marker, 1)
          perf_test.write_text(text, encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.py src/value_dislocation/history.py src/value_dislocation/strategy/rule_learning.py tests/test_extended_validation_horizons.py pyproject.toml src/value_dislocation/__init__.py harness/app_blueprint.yaml tests/test_package_init.py tests/test_sort_performance_and_readme_structure.py README.md CHANGELOG.md tasks/CURRENT.md
          if ! git diff --cached --quiet; then
            git commit -m "Fix legacy horizon column compatibility in v0.6.60"
            git push origin HEAD:fix/v0.6.60-legacy-horizon-columns
          fi
