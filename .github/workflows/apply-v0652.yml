name: Apply v0.6.52 sortable table headers

on:
  push:
    branches:
      - feature/v0.6.52-restore-table-sorting
    paths:
      - .github/workflows/apply-v0652.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6.52-restore-table-sorting
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply v0.6.52 changes
        run: python scripts/_apply_v0652.py

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dashboard,dev]"

      - name: Run pytest
        run: python -m pytest tests/

      - name: Run harness checks
        run: python scripts/harness_check.py

      - name: Commit v0.6.52 changes and remove temporary files
        shell: bash
        run: |
          rm -rf src/*.egg-info
          rm scripts/_apply_v0652.py
          rm .github/workflows/apply-v0652.yml
          git config user.name "hnamaizawa"
          git config user.email "hnamaizawa@gmail.com"
          git add dashboard.py pyproject.toml README.md CHANGELOG.md tests/test_sortable_clickable_tables.py
          git add -u scripts/_apply_v0652.py .github/workflows/apply-v0652.yml
          git commit -m "v0.6.52 restore sortable clickable table headers"
          git push origin feature/v0.6.52-restore-table-sorting
