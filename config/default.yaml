paths:
  companies: data/sample/companies.csv
  prices: data/sample/prices.csv
  financials: data/sample/financials.csv
  events: data/sample/events.csv
  output_dir: outputs

universe:
  allowed_markets: [Prime, Standard, Growth]
  min_average_turnover_yen_20d: 50000000
  min_price_yen: 200
  exclude_negative_equity: true

screen:
  selection_strategy: value_dislocation
  minimum_volatility_60d: 0.35
  minimum_average_intraday_range_20d: 0.025
  minimum_daytrade_activity_score: 50
  min_score: 62
  max_candidates: 12
  max_event_age_days: 365
  require_approved_external_event: true
  minimum_externality: 0.60
  minimum_temporary_probability: 0.55
  minimum_catalyst_probability: 0.35
  minimum_equity_ratio: 0.30
  use_structural_deterioration_guard: true
  minimum_cash_conversion_ratio: 0.70
  minimum_operating_margin_change_3y: -0.03
  minimum_forecast_revision_rate: -0.10
  minimum_sector_relative_return_6m: -0.15
  maximum_forecast_op_decline: -0.20
  minimum_drawdown_52w: -0.18
  minimum_relative_underperformance_6m: -0.08

# Demo/sample config never auto-learns. Actual-data config enables the guarded learner.
rule_learning:
  enabled: false
  auto_apply: false
  primary_horizon_days: 90
  minimum_mature_events: 40
  minimum_train_events: 20
  minimum_validation_events: 10
  train_fraction: 0.70
  minimum_event_gap_days: 30
  minimum_mean_return_improvement: 0.02
  minimum_positive_rate_improvement: 0.00
  minimum_candidate_retention: 0.35
  maximum_confirmation_mean_decline: 0.01
  cooldown_days: 30

risk:
  trading_capital_yen: 3000000
  max_total_invested_ratio: 0.60
  max_positions: 6
  max_position_ratio: 0.10
  max_sector_ratio: 0.25
  risk_per_position_ratio: 0.008
  catastrophic_stop_pct: 0.22
  take_profit_pct: 0.35
  board_lot: 100
  entry_tranches:
    - {weight: 0.40, discount_from_close: 0.02}
    - {weight: 0.30, discount_from_close: 0.07}
    - {weight: 0.30, discount_from_close: 0.12}

backtest:
  top_n: 6
  initial_capital_yen: 3000000
  transaction_cost_bps: 10
  rebalance_frequency: M